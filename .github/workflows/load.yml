name: load

# Spec §8 load leg — manual trigger only (heavy; not part of the PR gate).
# Runs the in-process claim-latency smoke: gateway dispatch + 2 node workers
# over real Postgres + Redis, 200 concurrent threads, p95 queue claim
# latency budgeted at 500ms. The k6 variant (scripts/load/k6-turns.js)
# drives a compose stack over real HTTP instead — see
# docs/site/_content/deploy/multi-node.md for the local runbook.

on:
  workflow_dispatch:
    inputs:
      threads:
        description: Concurrent threads (sessions)
        default: "200"
      per_thread:
        description: Messages per thread
        default: "1"
      p95_ms:
        description: Claim-latency p95 budget (ms)
        default: "500"

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claim-latency:
    name: claim latency — ${{ inputs.threads }} threads (real PG 16 + Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slaude
          POSTGRES_PASSWORD: slaude
          POSTGRES_DB: slaude
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slaude"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Claim-latency load smoke
        env:
          SLAUDE_DB: pg
          SLAUDE_PG_URL: postgres://slaude:slaude@localhost:5432/slaude
          SLAUDE_REDIS_URL: redis://localhost:6379
          THREADS: ${{ inputs.threads }}
          PER_THREAD: ${{ inputs.per_thread }}
          P95_MS: ${{ inputs.p95_ms }}
        run: |
          bun scripts/load/claim-latency.ts \
            --threads "${THREADS}" --per-thread "${PER_THREAD}" --p95-ms "${P95_MS}"
