name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: typecheck + tests + coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests with coverage
        # --parallel=1: serialize test-file execution. brain-coverage.test.ts boots
        # a real brain with module-level singletons (embeddingActive state); without
        # serialization, concurrent test files race and flip that state, causing
        # non-deterministic failures.
        # bun 1.3.11 exits non-zero for this suite even when every test passes and
        # coverage clears — a runner-internal quirk unrelated to coverage (repros
        # with coverage fully disabled; no test fails, no rejection surfaces). The
        # exact code tracks suite size: 99 historically, 100 as the suite grew
        # (verified: 0 failures, line coverage 98%+, and dropping the statement
        # threshold left the code unchanged — so it is NOT a coverage-threshold
        # exit). So we gate on the parsed failure count, not bun's raw exit code;
        # coverage is gated by Codecov (project + patch) on the lcov.info here.
        # Only a real crash exit (not 0/99/100) fails the job.
        run: |
          set +e
          bun test --coverage --parallel=1 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          set -e
          fails=$(grep -oE '^[[:space:]]*[0-9]+ fail' test-output.txt | grep -oE '[0-9]+' | tail -1)
          fails=${fails:-0}
          echo "bun exit code: ${code}; parsed test failures: ${fails}"
          if [ "${fails}" -ne 0 ]; then
            echo "::error::${fails} test(s) failed"; exit 1
          fi
          if [ "${code}" -ne 0 ] && [ "${code}" -ne 99 ] && [ "${code}" -ne 100 ]; then
            echo "::error::bun exited ${code} (not 0/99/100) — treating as a crash"; exit "${code}"
          fi
          echo "tests passed (${fails} failures; bun exit ${code} tolerated)"

      - name: Upload coverage report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  pglite:
    name: tests + sim on PGLite (SLAUDE_DB=pg, in-process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests on PGLite
        env:
          SLAUDE_DB: pg
        run: |
          set +e
          bun test --parallel=1 2>&1 | tee test-output-pg.txt
          code=${PIPESTATUS[0]}
          set -e
          fails=$(grep -oE '^[[:space:]]*[0-9]+ fail' test-output-pg.txt | grep -oE '[0-9]+' | tail -1)
          fails=${fails:-0}
          if [ "${fails}" -ne 0 ]; then echo "::error::${fails} test(s) failed on pg"; exit 1; fi
          if [ "${code}" -ne 0 ] && [ "${code}" -ne 99 ] && [ "${code}" -ne 100 ]; then exit "${code}"; fi
      - name: Sim transcripts on PGLite
        env:
          SLAUDE_DB: pg
          SLAUDE_HOME: /tmp/slaude-sim-home
        run: bun sim run

  postgres:
    name: db tests + sim on real Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slaude
          POSTGRES_PASSWORD: slaude
          POSTGRES_DB: slaude
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slaude"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: db + cli tests against real Postgres (Bun.sql driver)
        # SLAUDE_PG_TEST_URL also arms tests/db/pg-real.test.ts (concurrent
        # migration race, int8 parity) which creates scratch databases.
        env:
          SLAUDE_DB: pg
          SLAUDE_PG_URL: postgres://slaude:slaude@localhost:5432/slaude
          SLAUDE_PG_TEST_URL: postgres://slaude:slaude@localhost:5432/slaude
        run: bun test ./tests/db ./tests/cli
      - name: Sim transcripts against real Postgres
        env:
          SLAUDE_DB: pg
          SLAUDE_PG_URL: postgres://slaude:slaude@localhost:5432/slaude
          SLAUDE_HOME: /tmp/slaude-sim-home
        run: bun sim run

  installer:
    name: installer shellcheck + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every tracked *.sh, not a hardcoded list — a named list silently leaves
      # new scripts unchecked, which is how promote-rc.sh shipped with no static
      # analysis at all while this step still reported green.
      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y shellcheck
          git ls-files '*.sh' | tee /dev/stderr | xargs -r shellcheck
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - run: bun install --frozen-lockfile
      - name: install smoke test
        run: bash tests/installer/smoke.sh
