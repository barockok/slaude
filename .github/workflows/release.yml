name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # install.sh derives the asset URL from the *tag* but package-release.sh
      # names the tarball from *package.json*. A mismatch ships a release whose
      # download 404s, so fail fast here instead.
      - name: Verify tag matches package.json version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          if [ "v${PKG_VERSION}" != "${REF_NAME}" ]; then
            echo "::error::tag ${REF_NAME} != package.json v${PKG_VERSION}"; exit 1
          fi
          echo "tag and package.json agree on ${REF_NAME}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        # bun 1.3.11 exits non-zero for this suite even when every test passes — a
        # runner-internal quirk unrelated to coverage (see ci.yml + PR #22). The
        # code tracks suite size: 99 historically, 100 as the suite grew (not a
        # coverage-threshold exit — verified in ci.yml). Gate on the parsed failure
        # count, not bun's raw exit code, so a clean run can't abort the release.
        # Only a real crash exit (not 0/99/100) is treated as a failure.
        run: |
          set +e
          bun test --coverage --parallel=1 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          set -e
          fails=$(grep -oE '^[[:space:]]*[0-9]+ fail' test-output.txt | grep -oE '[0-9]+' | tail -1)
          fails=${fails:-0}
          echo "bun exit code: ${code}; parsed test failures: ${fails}"
          if [ "${fails}" -ne 0 ]; then
            echo "::error::${fails} test(s) failed"; exit 1
          fi
          if [ "${code}" -ne 0 ] && [ "${code}" -ne 99 ] && [ "${code}" -ne 100 ]; then
            echo "::error::bun exited ${code} (not 0/99/100) — treating as a crash"; exit "${code}"
          fi
          echo "tests passed (${fails} failures; bun exit ${code} tolerated)"

      - name: Generate changelog
        id: changelog
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES_FILE="docs/site/_content/releases/${REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using hand-written notes from $NOTES_FILE"
            cp "$NOTES_FILE" CHANGELOG.md
          else
            PREV=$(git tag --sort=-v:refname | grep -v "^${REF_NAME}$" | head -n1 || true)
            {
              echo "## What changed"
              echo
              if [ -n "$PREV" ]; then
                git log --pretty=tformat:'- %s (%h)' "${PREV}..${REF_NAME}"
                echo
                echo "**Full diff:** https://github.com/${REPO}/compare/${PREV}...${REF_NAME}"
              else
                git log --pretty=tformat:'- %s (%h)' "${REF_NAME}"
              fi
            } > CHANGELOG.md
          fi

      - name: Package release tarball
        run: |
          mkdir -p dist
          bash scripts/package-release.sh dist
          ls -l dist

      # An RC exists to catch install-path regressions before the stable tag.
      # ci.yml only smokes the installer on main/PRs, so a release built from a
      # tag would otherwise ship unverified. Runs on every tag — an RC that
      # skipped this check would not be worth soaking.
      - name: Installer smoke test
        run: bash tests/installer/smoke.sh

      # Repo has GitHub's immutable-releases policy on: a non-draft release
      # publishes (and locks) on creation, so uploading the second asset
      # (sha256sums.txt) after the first races the publish and 404s. Create
      # as a draft (assets can still attach) then flip it published once
      # both files are up, per GitHub's own fix for this error.
      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/slaude-*.tar.gz
            dist/sha256sums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default box image (boxes/default): what `box: default` runs on. It
      # is built first because the slaude image records where it was pushed
      # (BOX_DEFAULT_IMAGES below). One platform, the one the slaude image of
      # this workflow is built for. The build gets no secret and no build
      # argument: a box image holds no credential.
      #
      # A builder of its own, not made the default (`use: false`): the slaude
      # image build below keeps the builder it always had.
      #
      # NOT RUN YET as written: these steps have never executed on a runner,
      # and no node has pulled the image they push. See
      # docs/site/_content/deploy/boxes.md.
      - name: Set up a builder for the default box
        id: boxbuilder
        uses: docker/setup-buildx-action@v3
        with:
          use: false

      - name: Docker meta (default box)
        id: boxmeta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-box-default
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # OCI media types and no attestation manifest: a node copies the image
      # by digest without converting it.
      - name: Build and push the default box
        id: box
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.boxbuilder.outputs.name }}
          context: boxes/default
          platforms: linux/amd64
          outputs: type=image,oci-mediatypes=true,push=true
          provenance: false
          sbom: false
          tags: ${{ steps.boxmeta.outputs.tags }}
          labels: ${{ steps.boxmeta.outputs.labels }}

      - name: Resolve the default box digest
        id: boxrefs
        env:
          BOX_REPOSITORY: ghcr.io/${{ github.repository }}-box-default
          BOX_DIGEST: ${{ steps.box.outputs.digest }}
        run: |
          set -euo pipefail
          repo="$(printf '%s' "$BOX_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          images="$(scripts/box-default-refs.sh "$repo" "$BOX_DIGEST" amd64)"
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          echo "default box: ${images}"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Where the default box was pushed (a location, not a secret).
          build-args: |
            BOX_DEFAULT_IMAGES=${{ steps.boxrefs.outputs.images }}
