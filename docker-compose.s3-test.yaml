# S3-compatible endpoint for the storage integration tests. Any S3 endpoint
# works (self-hosted MinIO, RustFS, SeaweedFS, Garage, AWS S3, R2); this file
# only starts one locally so the tests have something to talk to.
#
#   docker compose -f docker-compose.s3-test.yaml up -d --wait
#   SLAUDE_S3_TEST_ENDPOINT=http://localhost:9100 bun test tests/storage
services:
  s3:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: slaude-test
      RUSTFS_SECRET_KEY: slaude-test-secret
    ports:
      - "9100:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: slaude-test
      AWS_SECRET_ACCESS_KEY: slaude-test-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["aws", "--endpoint-url", "http://s3:9000", "s3", "mb", "s3://slaude-test"]
    restart: "no"
