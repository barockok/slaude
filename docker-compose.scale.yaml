# Horizontal-scale slaude (spec §1): one gateway replica + two node workers
# against Postgres 16 and Redis 7, sharing $SLAUDE_HOME through a named volume.
#
#   docker compose -f docker-compose.scale.yaml up --build
#
# Env (put in .env next to this file; everything has a dev default except the
# secrets you choose):
#   SLAUDE_NODE_TOKEN   static bearer nodes present on the gateway /v1  (required)
#   SLAUDE_JOB_SECRET   HMAC secret for per-turn job tokens             (required)
#   SLAUDE_MASTER_KEY   32 random bytes, base64 — encrypts Slack app
#                       secrets at rest (openssl rand -base64 32)       (required)
#                       WARNING: rotating/regenerating this key ORPHANS the
#                       existing slack_apps registry — rows encrypted under
#                       the old key can no longer be decrypted. Keep the key
#                       stable; after a rotation, re-register every app.
#   ANTHROPIC_API_KEY / ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN /
#   CLAUDE_CODE_OAUTH_TOKEN   agent LLM auth — needed by NODES to run real
#                             turns; the stack boots and reports healthy
#                             without them (no turns until creds exist).
#   SLAUDE_MODEL        model id (default claude-sonnet-4-6)
#
# Slack ingress is the Events API (SLAUDE_SLACK_MODE=http): the gateway serves
# POST /slack/events and /slack/interactions on :8080 — point your Slack app
# (or a tunnel) there. Apps live in the Postgres slack_apps registry, not env,
# and the gateway refuses to start while the registry is empty — register the
# app first (one-off container, same env):
#   docker compose -f docker-compose.scale.yaml run --rm gateway \
#     bun run slack-app add --api-app-id A… --team-id T… \
#     --bot-token xoxb-… --signing-secret …
# SOUL.md lives on the shared volume: copy it in with
#   docker compose -f docker-compose.scale.yaml cp ./data/SOUL.md gateway:/data/SOUL.md
#
# The single-process deployment stays in docker-compose.yaml — this file is
# the multi-node topology only.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: slaude
      POSTGRES_PASSWORD: slaude
      POSTGRES_DB: slaude
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slaude -d slaude"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build: .
    image: slaude:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SLAUDE_HOME: /data
      SLAUDE_ROLE: gateway
      SLAUDE_SLACK_MODE: http
      SLAUDE_HTTP_PORT: "8080"
      SLAUDE_DB: pg
      SLAUDE_PG_URL: postgres://slaude:slaude@postgres:5432/slaude
      SLAUDE_REDIS_URL: redis://redis:6379
      SLAUDE_NODE_TOKEN: ${SLAUDE_NODE_TOKEN:?set SLAUDE_NODE_TOKEN in .env}
      SLAUDE_JOB_SECRET: ${SLAUDE_JOB_SECRET:?set SLAUDE_JOB_SECRET in .env}
      SLAUDE_MASTER_KEY: ${SLAUDE_MASTER_KEY:?set SLAUDE_MASTER_KEY in .env (openssl rand -base64 32)}
      SLAUDE_MODEL: ${SLAUDE_MODEL:-claude-sonnet-4-6}
    ports:
      - "8080:8080"
    volumes:
      - slaude-home:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  node-1:
    image: slaude:latest
    restart: unless-stopped
    command: ["bun", "run", "worker"]
    depends_on:
      gateway:
        condition: service_healthy
    environment: &node-env
      SLAUDE_HOME: /data
      SLAUDE_ROLE: node
      SLAUDE_GATEWAY_URL: http://gateway:8080
      SLAUDE_REDIS_URL: redis://redis:6379
      SLAUDE_NODE_TOKEN: ${SLAUDE_NODE_TOKEN:?set SLAUDE_NODE_TOKEN in .env}
      SLAUDE_NODE_PORT: "8081"
      SLAUDE_MODEL: ${SLAUDE_MODEL:-claude-sonnet-4-6}
      # Agent LLM auth (turns run on nodes).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - slaude-home:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  node-2:
    image: slaude:latest
    restart: unless-stopped
    command: ["bun", "run", "worker"]
    depends_on:
      gateway:
        condition: service_healthy
    environment: *node-env
    volumes:
      - slaude-home:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pg-data:
  redis-data:
  slaude-home:
