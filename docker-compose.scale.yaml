# Horizontal-scale slaude (spec §1): one gateway replica + two node workers
# against Postgres 16 and Redis 7, sharing $SLAUDE_HOME through a named volume.
# Postgres carries pgvector because the brain runs there too: a gateway refuses
# to boot on embedded storage, so the brain uses a separate slaude_brain database
# (created by deploy/postgres-init on first initialisation) instead of PGLite.
#
#   docker compose -f docker-compose.scale.yaml up --build
#
# Env (put in .env next to this file; everything has a dev default except the
# secrets you choose):
#   SLAUDE_NODE_TOKEN   static bearer nodes present on the gateway /v1  (required)
#   SLAUDE_JOB_SECRET   HMAC secret for per-turn job tokens             (required)
#   SLAUDE_MASTER_KEY   32 random bytes, base64 — encrypts Slack app
#                       secrets at rest (openssl rand -base64 32)       (required)
#                       WARNING: rotating/regenerating this key ORPHANS the
#                       existing slack_apps registry — rows encrypted under
#                       the old key can no longer be decrypted. Keep the key
#                       stable; after a rotation, re-register every app.
#   ANTHROPIC_API_KEY / ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN /
#   CLAUDE_CODE_OAUTH_TOKEN   agent LLM auth — needed by NODES to run real
#                             turns; the stack boots and reports healthy
#                             without them (no turns until creds exist).
#   SLAUDE_MODEL        model id (default claude-sonnet-4-6)
#
# Slack ingress is the Events API (SLAUDE_SLACK_MODE=http): the gateway serves
# POST /slack/events and /slack/interactions on :8080 — point your Slack app
# (or a tunnel) there. Apps live in the Postgres slack_apps registry, not env,
# and the gateway refuses to start while the registry is empty — register the
# app first (one-off container, same env):
#   docker compose -f docker-compose.scale.yaml run --rm gateway \
#     bun run slack-app add --api-app-id A… --team-id T… \
#     --bot-token xoxb-… --signing-secret …
# SOUL.md lives on the shared volume: copy it in with
#   docker compose -f docker-compose.scale.yaml cp ./data/SOUL.md gateway:/data/SOUL.md
#
# Boxes (optional, off by default; docs: deploy/boxes). Each node gets a
# privileged supervisor container (`boxd-1`, `boxd-2`) under the compose
# profile `boxes`, and runs every boxed session in its own sandbox there:
#   SLAUDE_BOX=on SLAUDE_BOX_TIER=gvisor \
#     docker compose -f docker-compose.scale.yaml --profile boxes up --build
# Without the profile and the two variables nothing changes: no privileged
# container is started, the gateway reads no box and the nodes offer tier
# `none`. Setting SLAUDE_BOX_TIER without the profile makes the nodes refuse to
# start (no supervisor answers), which is the intended failure.
#   SLAUDE_BOX              on | off (default off): the gateway reads boxes
#   SLAUDE_BOX_TIER         none (default) | gvisor | bwrap, for nodes AND supervisors
#   SLAUDE_NODE_MAX_BOXES   sandboxes per node (default 4 here)
#   SLAUDE_BOXD_MEMORY      memory limit of each supervisor (default 6g); the
#                           node refuses to start when it cannot hold
#                           SLAUDE_NODE_MAX_BOXES boxes
# NOT RUN as a compose stack: the supervisor, the node worker and the image's
# box layers ran together in one privileged container on a development VM (the
# 2026-11-25 box smoke field note); these services put the same pieces in two
# containers that share volumes, and that arrangement has not been started.
#
# The single-process deployment stays in docker-compose.yaml — this file is
# the multi-node topology only.

services:
  postgres:
    # pgvector: the brain runs on this server (a gateway may not use the brain's
    # embedded PGLite engine), and gbrain needs the vector extension.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: slaude
      POSTGRES_PASSWORD: slaude
      POSTGRES_DB: slaude
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Creates the separate slaude_brain database on first initialisation.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slaude -d slaude"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build: .
    image: slaude:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SLAUDE_HOME: /data
      SLAUDE_ROLE: gateway
      SLAUDE_SLACK_MODE: http
      SLAUDE_HTTP_PORT: "8080"
      SLAUDE_DB: pg
      SLAUDE_PG_URL: postgres://slaude:slaude@postgres:5432/slaude
      # A gateway refuses to boot with the brain on its embedded PGLite engine.
      SLAUDE_BRAIN_ENGINE: postgres
      SLAUDE_BRAIN_DATABASE_URL: postgres://slaude:slaude@postgres:5432/slaude_brain
      SLAUDE_REDIS_URL: redis://redis:6379
      SLAUDE_NODE_TOKEN: ${SLAUDE_NODE_TOKEN:?set SLAUDE_NODE_TOKEN in .env}
      SLAUDE_JOB_SECRET: ${SLAUDE_JOB_SECRET:?set SLAUDE_JOB_SECRET in .env}
      SLAUDE_MASTER_KEY: ${SLAUDE_MASTER_KEY:?set SLAUDE_MASTER_KEY in .env (openssl rand -base64 32)}
      SLAUDE_MODEL: ${SLAUDE_MODEL:-claude-sonnet-4-6}
      # Boxes are stored by a sync either way; `on` makes the gateway read them.
      SLAUDE_BOX: ${SLAUDE_BOX:-off}
    ports:
      - "8080:8080"
    volumes:
      - slaude-home:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  node-1:
    image: slaude:latest
    restart: unless-stopped
    command: ["bun", "--no-env-file", "src/node/main.ts"]
    depends_on:
      gateway:
        condition: service_healthy
    environment: &node-env
      SLAUDE_HOME: /data
      SLAUDE_ROLE: node
      SLAUDE_GATEWAY_URL: http://gateway:8080
      SLAUDE_REDIS_URL: redis://redis:6379
      SLAUDE_NODE_TOKEN: ${SLAUDE_NODE_TOKEN:?set SLAUDE_NODE_TOKEN in .env}
      SLAUDE_NODE_PORT: "8081"
      SLAUDE_MODEL: ${SLAUDE_MODEL:-claude-sonnet-4-6}
      # Agent LLM auth (turns run on nodes).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Boxes: `none` runs every session on the node itself, as before. The
      # other variables are read only on a sandbox tier.
      SLAUDE_BOX_TIER: ${SLAUDE_BOX_TIER:-none}
      SLAUDE_NODE_MAX_BOXES: ${SLAUDE_NODE_MAX_BOXES:-4}
      SLAUDE_BOX_DIR: /var/lib/slaude-box
      SLAUDE_BOXD_SOCKET: /run/slaude-box/boxd.sock
    volumes:
      - slaude-home:/data
      # Shared with this node's supervisor (boxd-1). The box volumes are empty
      # and unused on tier `none`. /config-home (each session's config
      # directory) was the container's own filesystem before; it is a volume of
      # this node alone now, never shared between nodes, so that the supervisor
      # can bind mount a session's directory into its box.
      - box-run-1:/run/slaude-box
      - box-data-1:/var/lib/slaude-box
      - config-home-1:/config-home
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  node-2:
    image: slaude:latest
    restart: unless-stopped
    command: ["bun", "--no-env-file", "src/node/main.ts"]
    depends_on:
      gateway:
        condition: service_healthy
    environment: *node-env
    volumes:
      - slaude-home:/data
      - box-run-2:/run/slaude-box
      - box-data-2:/var/lib/slaude-box
      - config-home-2:/config-home
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The box supervisor of node-1. Started only with `--profile boxes`.
  # Privileged, and for that reason given nothing: no env_file, no credential,
  # no network (it makes no network call). It refuses to start with a
  # credential or provider variable in its environment. Under tini, never as
  # pid 1: ended sandbox processes are left for pid 1 to reap.
  boxd-1: &boxd
    profiles: ["boxes"]
    image: slaude:latest
    restart: unless-stopped
    command: ["tini", "--", "bun", "--no-env-file", "src/box/boxd/main.ts", "--mount-root", "/data", "--mount-root", "/config-home", "--ro-root", "/app"]
    privileged: true
    # Its own cgroup namespace: the supervisor gives each sandbox a cgroup
    # under its own, and reads its memory limit from it.
    cgroup: private
    network_mode: none
    mem_limit: ${SLAUDE_BOXD_MEMORY:-6g}
    environment: &boxd-env
      SLAUDE_BOX_TIER: ${SLAUDE_BOX_TIER:-gvisor}
      SLAUDE_BOX_DIR: /var/lib/slaude-box
      SLAUDE_BOXD_SOCKET: /run/slaude-box/boxd.sock
    volumes:
      - slaude-home:/data
      - box-run-1:/run/slaude-box
      - box-data-1:/var/lib/slaude-box
      - config-home-1:/config-home

  # The box supervisor of node-2.
  boxd-2:
    <<: *boxd
    volumes:
      - slaude-home:/data
      - box-run-2:/run/slaude-box
      - box-data-2:/var/lib/slaude-box
      - config-home-2:/config-home

volumes:
  pg-data:
  redis-data:
  slaude-home:
  # One pair per node: a supervisor serves exactly one node worker.
  box-run-1:
  box-data-1:
  box-run-2:
  box-data-2:
  config-home-1:
  config-home-2:
