# Credentials for the object store. Loaded by the gateway and by every node
# deployment (the patches in kustomization.yaml add the envFrom). Replace it with
# your sealed or external-secrets equivalent; never commit real values.
#
# Scope the key to this cluster's bucket and prefix. A node needs read and write
# on `<prefix>/sessions/*` and `<prefix>/shared/*`, list on the prefix, and
# nothing else. This is the same trust a shared volume gave the node: whoever can
# run a prompt on a node can reach what that key reaches.
apiVersion: v1
kind: Secret
metadata:
  name: slaude-scale-s3
  namespace: slaude-scale
type: Opaque
stringData:
  SLAUDE_S3_ACCESS_KEY_ID: "REPLACE"
  SLAUDE_S3_SECRET_ACCESS_KEY: "REPLACE"
