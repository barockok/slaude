# Local-only. Part of the local overlay (kustomization.yaml): it is the MCP
# bridge's upstream for the `beta` persona, reached in-cluster as
# http://mock-mcp:9000/mcp. mock-mcp.sh additionally registers it for the
# portal's OAuth connect flow. The server source is mounted from the
# mock-mcp-src ConfigMap, generated from server.ts. Runs on the slaude image
# (it has bun).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-mcp
  namespace: slaude-scale
spec:
  replicas: 1
  selector:
    matchLabels: { app: mock-mcp }
  template:
    metadata:
      labels: { app: mock-mcp }
    spec:
      enableServiceLinks: false
      containers:
        - name: mock-mcp
          image: slaude:local
          imagePullPolicy: Never
          command: ["bun", "/mock/server.ts"]
          env:
            - { name: MOCK_MCP_ORIGIN, value: "http://mockmcp.localtest.me:9000" }
          ports:
            - containerPort: 9000
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 100m, memory: 192Mi }
          volumeMounts:
            - { name: src, mountPath: /mock, readOnly: true }
      volumes:
        - name: src
          configMap: { name: mock-mcp-src }
---
apiVersion: v1
kind: Service
metadata:
  name: mock-mcp
  namespace: slaude-scale
spec:
  selector: { app: mock-mcp }
  ports:
    - { port: 9000, targetPort: 9000 }
