# Local overlay: the horizontal-scale topology from deploy/k8s-scale on a
# single-node minikube. Production manifests are referenced, never copied or
# edited, so this overlay cannot drift from what actually ships.
#
# Referencing files outside this directory needs the load restrictor relaxed,
# so plain `kubectl apply -k` will refuse it. Use ./up.sh, or:
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s-local | kubectl apply -f -
#
# What differs from production, and why:
#   - Image is built into minikube and never pulled.
#   - Shared $SLAUDE_HOME uses minikube's hostpath class. It honours
#     ReadWriteMany only because every pod lands on the ONE minikube node;
#     a multi-node minikube would strand pods exactly like RWO storage does.
#   - Postgres and Redis run in-cluster (the dev stand-ins), single replica.
#   - No Ingress: Slack cannot reach a laptop anyway, and the Service stays.
#   - CPU HPA instead of KEDA, capped low enough to fit the VM.
#   - Resource requests trimmed and node drain shortened, so a laptop fits two
#     of each tier and failover tests finish in seconds rather than minutes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: slaude-scale

resources:
  - ../k8s-scale/00-namespace.yaml
  - ../k8s-scale/20-config.yaml
  - ../k8s-scale/30-pvc.yaml
  - ../k8s-scale/40-gateway.yaml
  - ../k8s-scale/50-node.yaml
  - ../k8s-scale/60-ingress.yaml
  - ../k8s-scale/70-autoscale.yaml
  - ../k8s-scale/90-dev-datastores.yaml

# Generated by up.sh and gitignored. secrets.env holds the stable internal
# secrets (a regenerated master key would orphan the encrypted slack_apps
# registry); provider.env is rewritten on every run from your shell.
secretGenerator:
  - name: slaude-scale-secrets
    envs:
      - secrets.env
      - provider.env

generatorOptions:
  disableNameSuffixHash: true

patches:
  # Slack ingress stays on the Events API: http mode boots with an empty
  # slack_apps registry, so the whole cluster comes up healthy with no Slack
  # credentials at all. Socket Mode would refuse to start without real tokens.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: slaude-scale-config
        namespace: slaude-scale
      data:
        SLAUDE_NODE_CONCURRENCY: "2"
        SLAUDE_NODE_DRAIN_SEC: "30"

  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: slaude-home
        namespace: slaude-scale
      spec:
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: slaude-gateway
        namespace: slaude-scale
      spec:
        template:
          spec:
            containers:
              - name: gateway
                image: slaude:local
                imagePullPolicy: Never
                env:
                  # KNOWN ISSUE, NOT A FIX. The brain is an embedded PGLite
                  # database whose home is $SLAUDE_HOME/brain — on the shared
                  # RWX volume. PGLite is single-writer, and at boot each
                  # process deletes any lock it finds as "stale". With two
                  # gateway replicas that is two writers on one database, each
                  # clearing the other's live lock. deploy/k8s-scale ships
                  # exactly that. Disabled here so the gateway/node HA
                  # machinery can be verified; brain HA is unverified and
                  # needs a single-writer design before production runs >1
                  # gateway with the brain enabled.
                  - name: SLAUDE_BRAIN_DISABLED
                    value: "1"
                resources:
                  requests: { cpu: 100m, memory: 256Mi }
                  limits: { cpu: "1", memory: 768Mi }

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: slaude-node
        namespace: slaude-scale
      spec:
        template:
          spec:
            # Must still exceed SLAUDE_NODE_DRAIN_SEC above.
            terminationGracePeriodSeconds: 45
            containers:
              - name: node
                image: slaude:local
                imagePullPolicy: Never
                resources:
                  requests: { cpu: 250m, memory: 384Mi }
                  limits: { cpu: 1500m, memory: 1536Mi }

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dev-postgres
        namespace: slaude-scale
      spec:
        template:
          spec:
            containers:
              - name: postgres
                resources:
                  requests: { cpu: 100m, memory: 192Mi }
                  limits: { memory: 512Mi }

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dev-redis
        namespace: slaude-scale
      spec:
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests: { cpu: 50m, memory: 64Mi }
                  limits: { memory: 256Mi }

  # KEDA is not installed locally; keep only the CPU fallback from the same file.
  - patch: |-
      $patch: delete
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: slaude-node
        namespace: slaude-scale

  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: slaude-node-cpu-fallback
        namespace: slaude-scale
      spec:
        minReplicas: 2
        maxReplicas: 3

  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: slaude-gateway
        namespace: slaude-scale
