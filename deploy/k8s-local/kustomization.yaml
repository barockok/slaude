# Local overlay: the horizontal-scale topology from deploy/k8s-scale on a
# single-node minikube. Production manifests are referenced, never copied or
# edited, so this overlay cannot drift from what actually ships.
#
# Referencing files outside this directory needs the load restrictor relaxed,
# so plain `kubectl apply -k` will refuse it. Use ./up.sh, or:
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s-local | kubectl apply -f -
#
# What differs from production, and why:
#   - Image is built into minikube and never pulled.
#   - Shared $SLAUDE_HOME uses minikube's hostpath class. It honours
#     ReadWriteMany only because every pod lands on the ONE minikube node;
#     a multi-node minikube would strand pods exactly like RWO storage does.
#   - Postgres and Redis run in-cluster (the dev stand-ins), single replica.
#   - No Ingress: Slack cannot reach a laptop anyway, and the Service stays.
#   - CPU HPA instead of KEDA, capped low enough to fit the VM.
#   - Resource requests and limits trimmed and node drain shortened, so a laptop
#     fits two of each tier and failover tests finish in seconds, not minutes.
#     The numbers are sized against sizing.env (the node size and the
#     provisional Docker VM floor), which is the one place they are written
#     down; tests/deploy/local-sizing.test.ts fails when they disagree. The
#     summed LIMITS at the pinned replica counts (2 gateways, 2 default nodes,
#     1 finance node, Postgres, Redis, Vault, the mock MCP server) must fit the
#     node size minus its system reserve.
#   - The label `finance` runs ONE node (production: at least two), so stopping
#     it shows an unserved label, and it has no autoscaler.
#   - A dev-mode Vault (vault.yaml) with token auth (SLAUDE_VAULT_AUTH=token,
#     SLAUDE_VAULT_ALLOW_INSECURE=1), seeded by vault.sh; production uses
#     Kubernetes auth with the gateway's projected token.
#   - Nodes hold no provider key and run with SLAUDE_PROVIDER_ENV_FALLBACK=0:
#     every persona's key comes from Vault through its runtime bundle.
#   - The mock MCP server is part of the overlay, as the MCP bridge's upstream.
#   - Probes are looser than the base's (5 s timeout, 5 failures, plus a
#     startupProbe): the base manifests are shared with production and keep
#     Kubernetes' defaults, a busy laptop does not meet them.
#   - The node HPA stays, and the verify scripts pin it for their run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: slaude-scale

resources:
  - ../k8s-scale/00-namespace.yaml
  - ../k8s-scale/20-config.yaml
  - ../k8s-scale/30-pvc.yaml
  - ../k8s-scale/40-gateway.yaml
  - ../k8s-scale/50-node.yaml
  - ../k8s-scale/60-ingress.yaml
  - ../k8s-scale/70-autoscale.yaml
  - ../k8s-scale/90-dev-datastores.yaml
  - vault.yaml
  - mock-mcp/mock-mcp.yaml

# Generated by up.sh and gitignored. secrets.env holds the stable internal
# secrets (a regenerated master key would orphan the encrypted slack_apps
# registry); node.env is derived from it on every run; provider.env is
# rewritten on every run from your shell; the node credentials are minted once
# (node-credentials.env) and written per node deployment on every run.
secretGenerator:
  # Gateway only (deploy/k8s-scale/40-gateway.yaml loads it through envFrom).
  - name: slaude-scale-secrets
    envs:
      - secrets.env
      - provider.env
  # Every node deployment: Redis only. No provider key (the fallback is off) and
  # never the gateway's secrets.env: a node holding the master key or the job
  # secret can act as the gateway, and the nodes here refuse to boot with one.
  - name: slaude-scale-node-secrets
    envs:
      - node.env
  # One credential per node deployment, read by key (deploy/k8s-scale/50-node.yaml).
  - name: slaude-scale-node-cred-default
    envs:
      - node-cred-default.env
  - name: slaude-scale-node-cred-finance
    envs:
      - node-cred-finance.env
  # The /deploy pipeline token, a separate Secret so it reaches the GATEWAY only.
  - name: slaude-scale-deploy
    envs:
      - deploy.env
  # The dev Vault's root token, loaded by the vault pod only.
  - name: slaude-local-vault
    envs:
      - vault-root.env

# Optional model override, written by up.sh from SLAUDE_LOCAL_MODEL (the file
# always exists and is empty when unset). It is a ConfigMap entry, not part of
# provider.env, because pods load envFrom with the Secret first and the
# ConfigMap second, and the later source wins: SLAUDE_MODEL in the Secret would
# lose to the base ConfigMap's value.
configMapGenerator:
  - name: slaude-scale-config
    namespace: slaude-scale
    behavior: merge
    envs:
      - model.env
  # Gateway-only switches up.sh decides per run (SLAUDE_LOCAL_LEGACY_DOOR):
  # SLAUDE_NODE_LEGACY=off when the legacy door is closed, else empty.
  - name: slaude-scale-gateway-config
    namespace: slaude-scale
    behavior: merge
    envs:
      - gateway.env
  # The mock MCP server's source (mock-mcp/mock-mcp.yaml mounts it).
  - name: mock-mcp-src
    namespace: slaude-scale
    files:
      - server.ts=mock-mcp/server.ts

generatorOptions:
  disableNameSuffixHash: true

patches:
  # Slack ingress is the Events API, inherited from deploy/k8s-scale. It is the
  # only mode a gateway accepts, and it boots with an empty slack_apps registry,
  # so the whole cluster comes up healthy with no Slack credentials at all.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: slaude-scale-config
        namespace: slaude-scale
      data:
        SLAUDE_NODE_CONCURRENCY: "2"
        SLAUDE_NODE_DRAIN_SEC: "30"
        # Takeover after a node dies is bounded by the session-lock TTL: the
        # dead node never releases it. Production defaults to 10 minutes, which
        # tolerates a long stall inside a live node. Locally the short TTL keeps
        # verify-turns.sh quick, and makes the takeover visible in seconds.
        SLAUDE_SESSION_LOCK_TTL_MS: "45000"
        SLAUDE_SESSION_LOCK_EXTEND_MS: "5000"
        # Every local persona declares a Vault provider key, so nodes need no
        # key of their own, and a persona without one fails its turn
        # (PROVIDER_CREDENTIALS_UNAVAILABLE) instead of running on a node key.
        SLAUDE_PROVIDER_ENV_FALLBACK: "0"

  # The dev Vault, the bridge upstream and a quick unserved signal. Gateway only.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: slaude-scale-gateway-config
        namespace: slaude-scale
      data:
        SLAUDE_VAULT_ADDR: "http://vault:8200"
        # Development only: token auth and plain http. The token is
        # SLAUDE_VAULT_TOKEN in the gateway Secret (secrets.env).
        SLAUDE_VAULT_AUTH: "token"
        SLAUDE_VAULT_ALLOW_INSECURE: "1"
        # Short, so a rotation shows on the next new thread within seconds.
        SLAUDE_VAULT_CACHE_TTL: "10"
        # The mock MCP server (the bridge's upstream for persona `beta`) and
        # Vault are private, http-only hosts the gateway reaches.
        SLAUDE_OUTBOUND_INTERNAL_HOSTS: "mock-mcp,vault"
        SLAUDE_LABEL_UNSERVED_SECS: "20"

  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: slaude-home
        namespace: slaude-scale
      spec:
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: slaude-gateway
        namespace: slaude-scale
      spec:
        template:
          spec:
            containers:
              - name: gateway
                image: slaude:local
                imagePullPolicy: Never
                # Gateway only. `env` merges by name; the node patch has no such entry.
                env:
                  - name: SLAUDE_DEPLOY_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: slaude-scale-deploy
                        key: SLAUDE_DEPLOY_TOKEN
                resources:
                  requests: { cpu: 100m, memory: 256Mi }
                  limits: { cpu: 400m, memory: 448Mi }
                # Probe values for a loaded laptop, merged over the base probes (httpGet and
                # periods stay the base's): a 1 s timeout and 3 failures kill a pod
                # that is merely busy, and /readyz queries Postgres on the event
                # loop that runs the turns. The startupProbe holds liveness off
                # while the pod boots (up to 5 s x 60 = 5 minutes).
                livenessProbe: { timeoutSeconds: 5, failureThreshold: 5 }
                readinessProbe: { timeoutSeconds: 5, failureThreshold: 5 }
                startupProbe:
                  httpGet: { path: /healthz, port: http }
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: slaude-node
        namespace: slaude-scale
      spec:
        template:
          spec:
            # Must still exceed SLAUDE_NODE_DRAIN_SEC above.
            terminationGracePeriodSeconds: 45
            containers:
              - name: node
                image: slaude:local
                imagePullPolicy: Never
                resources:
                  requests: { cpu: 250m, memory: 384Mi }
                  limits: { cpu: 700m, memory: 896Mi }
                # Probe values for a loaded laptop, merged over the base probes (httpGet and
                # periods stay the base's): a 1 s timeout and 3 failures kill a pod
                # that is merely busy, and /readyz queries Postgres on the event
                # loop that runs the turns. The startupProbe holds liveness off
                # while the pod boots (up to 5 s x 60 = 5 minutes).
                livenessProbe: { timeoutSeconds: 5, failureThreshold: 5 }
                readinessProbe: { timeoutSeconds: 5, failureThreshold: 5 }
                startupProbe:
                  httpGet: { path: /healthz, port: health }
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: slaude-node-finance
        namespace: slaude-scale
      spec:
        # One node: production keeps two per label; here stopping it is how
        # verify-turns.sh shows an unserved label.
        replicas: 1
        template:
          spec:
            terminationGracePeriodSeconds: 45
            containers:
              - name: node
                image: slaude:local
                imagePullPolicy: Never
                resources:
                  requests: { cpu: 250m, memory: 384Mi }
                  limits: { cpu: 700m, memory: 896Mi }
                livenessProbe: { timeoutSeconds: 5, failureThreshold: 5 }
                readinessProbe: { timeoutSeconds: 5, failureThreshold: 5 }
                startupProbe:
                  httpGet: { path: /healthz, port: health }
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dev-postgres
        namespace: slaude-scale
      spec:
        template:
          spec:
            containers:
              - name: postgres
                resources:
                  requests: { cpu: 100m, memory: 192Mi }
                  limits: { cpu: 400m, memory: 240Mi }

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dev-redis
        namespace: slaude-scale
      spec:
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests: { cpu: 50m, memory: 64Mi }
                  limits: { cpu: 200m, memory: 64Mi }

  # KEDA is not installed locally; keep only the default label's CPU fallback.
  - patch: |-
      $patch: delete
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: slaude-node
        namespace: slaude-scale

  - patch: |-
      $patch: delete
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: slaude-node-finance
        namespace: slaude-scale

  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: slaude-node-finance-cpu-fallback
        namespace: slaude-scale

  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: slaude-node-cpu-fallback
        namespace: slaude-scale
      spec:
        minReplicas: 2
        maxReplicas: 3

  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: slaude-gateway
        namespace: slaude-scale
