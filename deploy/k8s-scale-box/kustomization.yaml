# Boxes on the scale topology: every node pod gains the box supervisor
# (`boxd`), and each agent session of a boxed persona runs in its own sandbox
# inside that container. Docs: docs/site/_content/deploy/boxes.md.
#
#   kubectl apply -k deploy/k8s-scale-box          # the base plus boxes
#   kubectl apply -k deploy/k8s-scale-box/with-s3  # the same on deploy/k8s-scale-s3
#
# once every REPLACE value in the base is filled in. The base keeps working
# unboxed: nothing here is in deploy/k8s-scale.
#
# NOT PROVEN ON A CLUSTER. Read this before applying it anywhere that matters:
#
#   - This overlay renders (`kubectl kustomize`) and its shape is tested
#     (tests/deploy/box-overlay.test.ts). It has never been applied to a
#     cluster. Whether runsc starts nested in a privileged container of a pod
#     on YOUR cluster is the open question the design calls K1; the steps that
#     answer it are in the 2026-11-25 box smoke field note ("What the owner
#     must run on a real cluster"). What has run: the same supervisor, node
#     worker and image layers in a privileged Docker container on a
#     development VM.
#   - The pod sizes in component/kustomization.yaml (the memory and CPU of
#     `boxd`, the 80Gi box volume, SLAUDE_NODE_MAX_BOXES=10) are the design's
#     worked example, not measurements. They satisfy the node's own boot check
#     (a test asserts it), which is all that is claimed for them.
#   - It needs a cluster that admits a privileged container. Pod Security
#     `restricted` and `baseline` namespaces refuse it.
#
# What is in component/ (a kustomize Component, so it can be laid over the
# base, over deploy/k8s-scale-s3, or over your own overlay):
#
#   - the `boxd` container on every node Deployment: the same image, started
#     as `tini -- bun --no-env-file src/box/boxd/main.ts ...`, privileged, with
#     no envFrom, no Secret and no credential (it refuses to start with one);
#   - two volumes, box-run (the control socket) and box-data (images, session
#     homes, root overlays, parked sessions), mounted in both containers;
#   - SLAUDE_BOX_TIER and the capacity variables on the `node` container, and
#     the resource split: `node` small, the boxes charged to `boxd`;
#   - SLAUDE_BOX=on on the gateway;
#   - the autoscaling half: KEDA `memory` and `cpu` triggers on the `boxd`
#     container beside the wait-list trigger (KEDA scales to the largest
#     replica count any trigger asks for), and a 300 s grace period: the drain
#     window (SLAUDE_NODE_DRAIN_SEC, default 120) plus the flush of the warm
#     boxes. The rule is in docs/site/_content/deploy/scale-operations.md
#     ("Drain arithmetic").
#
# optional/node-box-fallback-hpa.yaml is the HPA for clusters without KEDA,
# with ContainerResource metrics for `boxd`. Like the base's CPU fallback it is
# NOT in this kustomization: never two autoscalers on one Deployment.
#
# With deploy/k8s-scale-s3: do not list both overlays as resources (each
# brings the base, and kustomize refuses the same object twice). Use with-s3/,
# or in your own kustomization:
#
#   resources:  [../k8s-scale-s3]
#   components: [../k8s-scale-box/component]
#
# Boxes keep a session's home across nodes only with SLAUDE_STORAGE=s3.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../k8s-scale

components:
  - component
