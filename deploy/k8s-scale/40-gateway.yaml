# Gateway tier (spec §1): stateless, N replicas behind the ingress. Owns
# Slack ingress (/slack/events, /slack/interactions, /slack/oauth/*), the
# /v1 REST for nodes, cron + reaper leadership (Redis-lock elected), and
# /healthz /readyz /metrics on the same port.
#
# Its own ServiceAccount, so a Role bound for the gateway never reaches nodes
# and nothing granted to `default` reaches the gateway. slaude makes no
# Kubernetes API call, so the API token is not mounted; set it to true only if
# you bind a Role that something in the pod uses. Vault's Kubernetes auth gets
# its own short-lived token instead (the vault-token volume below), bound to
# this ServiceAccount: the Vault role must name slaude-gateway and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slaude-gateway
  namespace: slaude-scale
  labels:
    app.kubernetes.io/name: slaude
    app.kubernetes.io/component: gateway
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slaude-gateway
  namespace: slaude-scale
  labels:
    app.kubernetes.io/name: slaude
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: slaude
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slaude
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: slaude-gateway
      # Gateways hold no in-flight turns; default grace is plenty for
      # draining HTTP + long-polls (Slack retries anything cut off).
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: ghcr.io/REPLACE/slaude:latest
          imagePullPolicy: Always
          # The gateway's own Secret, whole. Never the node's: that one may hold
          # a node-side provider fallback the gateway must not pick up.
          envFrom:
            - secretRef:
                name: slaude-scale-secrets
            - configMapRef:
                name: slaude-scale-config
            # Gateway only: Vault, the outbound policy, the node-credential door.
            - configMapRef:
                name: slaude-scale-gateway-config
          env:
            # The queues' Redis, shared with nodes, read by key from the node
            # Secret so the value has one source. The node credential is NOT
            # read from there: a node's SLAUDE_NODE_TOKEN may be a signed
            # credential, which the gateway verifies with SLAUDE_NODE_KEY and
            # must never accept as the legacy shared token. The legacy value
            # is SLAUDE_NODE_LEGACY_TOKEN in the gateway's own Secret.
            - name: SLAUDE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: slaude-scale-node-secrets
                  key: SLAUDE_REDIS_URL
            - name: SLAUDE_HOME
              value: /data
            - name: SLAUDE_ROLE
              value: gateway
            - name: SLAUDE_HTTP_PORT
              value: "8080"
            # Strict soul extraction (persona sync) caches its result. The
            # default, $SLAUDE_HOME/cache, is on the shared volume every node
            # and agent turn can write, so a planted cache file could install
            # forged approvers. Keep the gateway's cache pod-local; a cache hit
            # is also re-checked against the soul text before it is used.
            - name: SLAUDE_SOUL_CACHE_DIR
              value: /soul-cache
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            # /readyz actively checks Postgres — a gateway that lost its DB
            # drops out of rotation and Slack traffic fails over (spec §6
            # failure matrix).
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: slaude-home
              mountPath: /data
            - name: soul-cache
              mountPath: /soul-cache
            # SLAUDE_VAULT_K8S_TOKEN_PATH (20-config.yaml) points here.
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: slaude-home
          persistentVolumeClaim:
            claimName: slaude-home
        # Pod-local: a restart loses it, which only costs a re-extraction.
        - name: soul-cache
          emptyDir:
            sizeLimit: 64Mi
        # A ServiceAccount token for Vault's Kubernetes login only: audience
        # `vault`, ten minutes, refreshed by the kubelet. Unused until
        # SLAUDE_VAULT_ADDR is set. Never mounted on a node.
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 600
                  path: token
---
# Keep at least one gateway during voluntary disruptions (node drains,
# upgrades) — it is the only Slack ingress and the nodes' control plane.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: slaude-gateway
  namespace: slaude-scale
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slaude
      app.kubernetes.io/component: gateway
