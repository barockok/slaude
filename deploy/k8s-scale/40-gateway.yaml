# Gateway tier (spec §1): stateless, N replicas behind the ingress. Owns
# Slack ingress (/slack/events, /slack/interactions, /slack/oauth/*), the
# /v1 REST for nodes, cron + reaper leadership (Redis-lock elected), and
# /healthz /readyz /metrics on the same port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slaude-gateway
  namespace: slaude-scale
  labels:
    app.kubernetes.io/name: slaude
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: slaude
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slaude
        app.kubernetes.io/component: gateway
    spec:
      # Gateways hold no in-flight turns; default grace is plenty for
      # draining HTTP + long-polls (Slack retries anything cut off).
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: ghcr.io/REPLACE/slaude:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: slaude-scale-secrets
            - configMapRef:
                name: slaude-scale-config
          env:
            - name: SLAUDE_HOME
              value: /data
            - name: SLAUDE_ROLE
              value: gateway
            - name: SLAUDE_HTTP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            # /readyz actively checks Postgres — a gateway that lost its DB
            # drops out of rotation and Slack traffic fails over (spec §6
            # failure matrix).
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: slaude-home
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: slaude-home
          persistentVolumeClaim:
            claimName: slaude-home
---
# Keep at least one gateway during voluntary disruptions (node drains,
# upgrades) — it is the only Slack ingress and the nodes' control plane.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: slaude-gateway
  namespace: slaude-scale
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slaude
      app.kubernetes.io/component: gateway
