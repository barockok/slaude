# Secrets TEMPLATE — replace every REPLACE_ value before applying.
#
# DO NOT commit a filled-in copy of this file. For GitOps, seal it instead
# (sealed-secrets controller + kubeseal):
#
#   kubeseal --format yaml < deploy/k8s-scale/10-secrets.yaml > deploy/k8s-scale/10-sealed-secrets.yaml
#
# and commit only the sealed output. Generate strong values:
#   SLAUDE_MASTER_KEY:  openssl rand -base64 32   (encrypts stored credentials at rest)
#   SLAUDE_NODE_KEY:    openssl rand -hex 32      (HS256 key for signed node credentials)
#   SLAUDE_NODE_LEGACY_TOKEN: openssl rand -hex 24 (legacy shared node bearer, while used)
#   SLAUDE_JOB_SECRET:  openssl rand -hex 24      (HS256 secret for per-turn job JWTs)
#   a node's SLAUDE_NODE_TOKEN: bun run node-token mint --label <label> (on a
#     gateway, which holds SLAUDE_NODE_KEY), or the same value as
#     SLAUDE_NODE_LEGACY_TOKEN for a legacy node (label `default` only)
#
# Secrets per tier: the gateway's, one shared by every node deployment (Redis,
# the provider fallback), and one credential Secret per node deployment, so a
# node of one label never holds the credential of another. A node that held the gateway's Secret could forge
# job tokens for any persona (SLAUDE_JOB_SECRET), decrypt every stored
# credential (SLAUDE_MASTER_KEY) and read every tenant's rows (the database
# URLs); a node needs none of them. The node boot check warns when it finds a
# gateway-only variable (src/config/gateway-only-env.ts has the list), and a
# later release refuses to boot.
#
# Postgres and Redis are EXTERNAL managed services (see README.md) — their
# URLs carry credentials, so they live here, not in the ConfigMap.

# --- Gateway only ----------------------------------------------------------
# Loaded by 40-gateway.yaml through envFrom. Never reference it from a node.
apiVersion: v1
kind: Secret
metadata:
  name: slaude-scale-secrets
  namespace: slaude-scale
type: Opaque
stringData:
  SLAUDE_MASTER_KEY: "REPLACE_base64_32_bytes"
  SLAUDE_JOB_SECRET: "REPLACE_hex_48"
  # Node credentials. SLAUDE_NODE_KEY signs and verifies them (must differ from
  # SLAUDE_JOB_SECRET; at least 32 characters). SLAUDE_NODE_LEGACY_TOKEN is the
  # shared token legacy nodes present as their SLAUDE_NODE_TOKEN; drop it and
  # set SLAUDE_NODE_LEGACY=off in the ConfigMap once every node has a signed
  # credential. Never put a signed credential here.
  # Optional: needed only to verify (and, with the CLI, mint) SIGNED node
  # credentials. Without it the legacy token below is the only door. The
  # template sets it because slaude-node-finance uses a signed credential.
  SLAUDE_NODE_KEY: "REPLACE_hex_64"
  # During a key rotation: the old key, still accepted when verifying. Set both,
  # re-mint and roll every node deployment, then drop this.
  # SLAUDE_NODE_KEY_PREVIOUS: ""
  SLAUDE_NODE_LEGACY_TOKEN: "REPLACE_hex_48"
  # Managed Postgres endpoint (in-cluster dev alternative: 90-dev-datastores.yaml).
  SLAUDE_PG_URL: "postgres://slaude:REPLACE_password@REPLACE-pg-host:5432/slaude"
  # The brain's own database on the same Postgres server, kept separate from
  # slaude's schema. It needs the vector, pg_trgm and pgcrypto extensions
  # (see deploy/postgres-init/10-brain-database.sql).
  SLAUDE_BRAIN_DATABASE_URL: "postgres://slaude:REPLACE_password@REPLACE-pg-host:5432/slaude_brain"
  # Slack OAuth install flow (spec §5 model B). CLIENT_ID enables
  # /slack/oauth/start + /slack/oauth/callback on the gateway; the signing
  # secret is stored on each installed slack_apps row (oauth.v2.access does
  # not return it).
  SLACK_CLIENT_ID: "REPLACE_client_id"
  SLACK_CLIENT_SECRET: "REPLACE_client_secret"
  SLACK_SIGNING_SECRET: "REPLACE_signing_secret"
  # Dedicated HMAC secret for the OAuth state token (openssl rand -hex 24);
  # unset → falls back to SLACK_CLIENT_SECRET with a logged warning.
  SLAUDE_OAUTH_STATE_SECRET: "REPLACE_hex_48"
  # The /deploy pipeline credential (personas as code), when used. Gateway only:
  # it rewrites persona identity.
  # SLAUDE_DEPLOY_TOKEN: "REPLACE_hex_48"
  # Vault, development token auth only (SLAUDE_VAULT_AUTH=token with
  # SLAUDE_VAULT_ALLOW_INSECURE=1). Production uses Kubernetes auth through the
  # gateway's projected ServiceAccount token (40-gateway.yaml) and needs no token.
  # SLAUDE_VAULT_TOKEN: ""
  # Values a persona's `${PERSONA_*}` placeholders or `env://PERSONA_*`
  # references name (personas as code). Gateway only, like everything here.
  # PERSONA_SUPPORT_BOT_XOXP: ""
  # LLM provider credentials for the GATEWAY's own model calls (soul extraction,
  # model listing). They reach nodes only through the runtime bundle of a
  # filesystem persona or the default tenant's env tier. A managed tenant's
  # bundle (personas as code) and a database persona's bundle carry only stored
  # credentials, never these; their nodes use the fallback in the node Secret.
  ANTHROPIC_API_KEY: "REPLACE_provider_key"
  # ANTHROPIC_BASE_URL: ""
  # ANTHROPIC_AUTH_TOKEN: ""
  # CLAUDE_CODE_OAUTH_TOKEN: ""
---
# --- Node, shared by every node deployment ---------------------------------
# Loaded by 50-node.yaml through envFrom. The gateway reads only SLAUDE_REDIS_URL
# from here, by key. No node credential lives here: each node deployment has
# its own credential Secret below.
apiVersion: v1
kind: Secret
metadata:
  name: slaude-scale-node-secrets
  namespace: slaude-scale
type: Opaque
stringData:
  # Managed Redis endpoint (in-cluster dev alternative: 90-dev-datastores.yaml).
  SLAUDE_REDIS_URL: "redis://REPLACE-redis-host:6379"
  # The provider env fallback: the agent child uses the node's own env when the
  # runtime bundle carries no provider credentials. A managed tenant (personas
  # as code) or database persona with no stored provider credentials relies on
  # this; a tenant whose bundle always carries them (every persona declares a
  # `provider`, or has stored credentials) does not: drop these and set
  # SLAUDE_PROVIDER_ENV_FALLBACK=0 in 20-config.yaml.
  ANTHROPIC_API_KEY: "REPLACE_provider_key"
  # ANTHROPIC_BASE_URL: ""
  # ANTHROPIC_AUTH_TOKEN: ""
  # CLAUDE_CODE_OAUTH_TOKEN: ""
---
# --- Node credentials, one Secret per node deployment ----------------------
# Each holds only that deployment's SLAUDE_NODE_TOKEN, read by key in
# 50-node.yaml. Mint on a gateway (it holds SLAUDE_NODE_KEY) and pipe the token
# straight into the Secret (without its trailing newline, which would be part of
# the bearer), so it is never on a command line or in a log:
#   kubectl -n slaude-scale exec deploy/slaude-gateway -- bun run node-token mint --label finance --id finance-a \
#     | tr -d '\n' | kubectl -n slaude-scale create secret generic slaude-scale-node-cred-finance \
#         --from-file=SLAUDE_NODE_TOKEN=/dev/stdin --dry-run=client -o yaml | kubectl apply -f -
# A credential carries its labels, so a `finance` node cannot serve `default`.
# The default deployment may instead hold SLAUDE_NODE_LEGACY_TOKEN (a legacy
# node, label `default` only) while SLAUDE_NODE_LEGACY is not `off`.
apiVersion: v1
kind: Secret
metadata:
  name: slaude-scale-node-cred-default
  namespace: slaude-scale
type: Opaque
stringData:
  SLAUDE_NODE_TOKEN: "REPLACE_signed_credential_label_default"
---
apiVersion: v1
kind: Secret
metadata:
  name: slaude-scale-node-cred-finance
  namespace: slaude-scale
type: Opaque
stringData:
  SLAUDE_NODE_TOKEN: "REPLACE_signed_credential_label_finance"
