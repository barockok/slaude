# Secrets TEMPLATE — replace every REPLACE_ value before applying.
#
# DO NOT commit a filled-in copy of this file. For GitOps, seal it instead
# (sealed-secrets controller + kubeseal):
#
#   kubeseal --format yaml < deploy/k8s-scale/10-secrets.yaml > deploy/k8s-scale/10-sealed-secrets.yaml
#
# and commit only the sealed output. Generate strong values:
#   SLAUDE_MASTER_KEY:  openssl rand -base64 32   (encrypts stored credentials at rest)
#   SLAUDE_NODE_TOKEN:  openssl rand -hex 24      (static bearer on every /v1 request)
#   SLAUDE_JOB_SECRET:  openssl rand -hex 24      (HS256 secret for per-turn job JWTs)
#
# Two Secrets, one per tier. A node that held the gateway's Secret could forge
# job tokens for any persona (SLAUDE_JOB_SECRET), decrypt every stored
# credential (SLAUDE_MASTER_KEY) and read every tenant's rows (the database
# URLs); a node needs none of them. The node boot check warns when it finds a
# gateway-only variable (src/config/gateway-only-env.ts has the list), and a
# later release refuses to boot.
#
# Postgres and Redis are EXTERNAL managed services (see README.md) — their
# URLs carry credentials, so they live here, not in the ConfigMap.

# --- Gateway only ----------------------------------------------------------
# Loaded by 40-gateway.yaml through envFrom. Never reference it from a node.
apiVersion: v1
kind: Secret
metadata:
  name: slaude-scale-secrets
  namespace: slaude-scale
type: Opaque
stringData:
  SLAUDE_MASTER_KEY: "REPLACE_base64_32_bytes"
  SLAUDE_JOB_SECRET: "REPLACE_hex_48"
  # Managed Postgres endpoint (in-cluster dev alternative: 90-dev-datastores.yaml).
  SLAUDE_PG_URL: "postgres://slaude:REPLACE_password@REPLACE-pg-host:5432/slaude"
  # The brain's own database on the same Postgres server, kept separate from
  # slaude's schema. It needs the vector, pg_trgm and pgcrypto extensions
  # (see deploy/postgres-init/10-brain-database.sql).
  SLAUDE_BRAIN_DATABASE_URL: "postgres://slaude:REPLACE_password@REPLACE-pg-host:5432/slaude_brain"
  # Slack OAuth install flow (spec §5 model B). CLIENT_ID enables
  # /slack/oauth/start + /slack/oauth/callback on the gateway; the signing
  # secret is stored on each installed slack_apps row (oauth.v2.access does
  # not return it).
  SLACK_CLIENT_ID: "REPLACE_client_id"
  SLACK_CLIENT_SECRET: "REPLACE_client_secret"
  SLACK_SIGNING_SECRET: "REPLACE_signing_secret"
  # Dedicated HMAC secret for the OAuth state token (openssl rand -hex 24);
  # unset → falls back to SLACK_CLIENT_SECRET with a logged warning.
  SLAUDE_OAUTH_STATE_SECRET: "REPLACE_hex_48"
  # The /deploy pipeline credential (personas as code), when used. Gateway only:
  # it rewrites persona identity.
  # SLAUDE_DEPLOY_TOKEN: "REPLACE_hex_48"
  # LLM provider credentials for the GATEWAY's own model calls (soul extraction,
  # model listing). They reach nodes only through the runtime bundle of a
  # filesystem persona or the default tenant's env tier. A managed tenant's
  # bundle (personas as code) and a database persona's bundle carry only stored
  # credentials, never these; their nodes use the fallback in the node Secret.
  ANTHROPIC_API_KEY: "REPLACE_provider_key"
  # ANTHROPIC_BASE_URL: ""
  # ANTHROPIC_AUTH_TOKEN: ""
  # CLAUDE_CODE_OAUTH_TOKEN: ""
---
# --- Node ------------------------------------------------------------------
# Loaded by 50-node.yaml through envFrom. The gateway reads SLAUDE_NODE_TOKEN
# (the value it accepts) and SLAUDE_REDIS_URL from here by key, so each value
# has one source.
apiVersion: v1
kind: Secret
metadata:
  name: slaude-scale-node-secrets
  namespace: slaude-scale
type: Opaque
stringData:
  SLAUDE_NODE_TOKEN: "REPLACE_hex_48"
  # Managed Redis endpoint (in-cluster dev alternative: 90-dev-datastores.yaml).
  SLAUDE_REDIS_URL: "redis://REPLACE-redis-host:6379"
  # The provider env fallback: the agent child uses the node's own env when the
  # runtime bundle carries no provider credentials. A managed tenant (personas
  # as code) or database persona with no stored provider credentials relies on
  # this; a tenant whose bundle always carries them does not, and can drop it.
  ANTHROPIC_API_KEY: "REPLACE_provider_key"
  # ANTHROPIC_BASE_URL: ""
  # ANTHROPIC_AUTH_TOKEN: ""
  # CLAUDE_CODE_OAUTH_TOKEN: ""
