# Node autoscaling on queue depth (spec §9 M5, "HPA on queue depth").
#
# CHOICE: KEDA with the `redis` (list-length) trigger, scaling on the BullMQ
# wait list directly.
#
#   - It measures the same source of truth the workers consume — no
#     Prometheus scrape loop in the control path, no metrics-adapter install,
#     and it works even when every gateway replica is down (the queue is the
#     ground truth for "work exists").
#   - The alternative (KEDA prometheus trigger on slaude_queue_depth) is
#     provided below for shops already running Prometheus; note that gauge is
#     exported only by the current reaper LEADER replica, so the query must
#     take max() across gateway pods.
#   - One ScaledObject per node label, each on its own label's wait list and
#     targeting that label's Deployment: label `default` is the `turns` queue,
#     any other label `turns.label.<label>`. A label's backlog scales only its
#     own nodes. Keep minReplicaCount at 2 or more per label for HA.
#   - Known blind spot of the list trigger: it sees the label's wait list
#     only. Per-node queues drain via the reaper's stall-rescue (jobs on
#     a dead/busy node's queue move to `turns` within ~5s), and delayed jobs
#     are retries/serialization backoffs — neither should drive scale-up.
#
# List key derivation — keep in sync with src/queue/keys.ts (labelTurnsQueue):
#   BullMQ key = <SLAUDE_REDIS_PREFIX>:bull:<queue>:wait
#   default    = slaude:bull:turns:wait
#   finance    = slaude:bull:turns.label.finance:wait
#
# Install KEDA first: https://keda.sh/docs/latest/deploy/
#
# Without KEDA, do not apply this file: apply
# optional/node-cpu-fallback-hpa.yaml instead (a CPU HPA per label). Never both:
# two autoscalers on one Deployment fight over its replica count.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: slaude-node
  namespace: slaude-scale
spec:
  scaleTargetRef:
    name: slaude-node
  minReplicaCount: 2
  maxReplicaCount: 20
  cooldownPeriod: 300 # scale-down waits for idle-TTL'd warm sessions to expire
  triggers:
    - type: redis
      metadata:
        # Same endpoint as SLAUDE_REDIS_URL in 10-secrets.yaml (host:port form).
        address: REPLACE-redis-host:6379
        listName: slaude:bull:turns:wait
        # Target waiting jobs per node replica. With SLAUDE_NODE_CONCURRENCY=8
        # a sustained backlog of >5 unclaimed jobs per node means claim
        # latency is already climbing toward the 500ms p95 SLO (spec §8).
        listLength: "5"
      # Managed Redis with AUTH: reference the password via a
      # TriggerAuthentication instead of inlining it:
      #   authenticationRef: { name: slaude-redis-auth }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: slaude-node-finance
  namespace: slaude-scale
spec:
  scaleTargetRef:
    name: slaude-node-finance
  minReplicaCount: 2
  maxReplicaCount: 10
  cooldownPeriod: 300
  triggers:
    - type: redis
      metadata:
        address: REPLACE-redis-host:6379
        listName: slaude:bull:turns.label.finance:wait
        listLength: "5"
#
# --- Variant B: KEDA prometheus trigger on the gateway's queue-depth gauge.
# Counts delayed + prioritized jobs too. Replace the redis trigger above with:
#
#    - type: prometheus
#      metadata:
#        serverAddress: http://prometheus.monitoring:9090
#        query: max(slaude_queue_depth{queue="turns"})   # max(): leader-only gauge
#        (for a label: the `label` series of the same gauge, one trigger per label)
#        threshold: "10"
