# OPTIONAL — a CPU HorizontalPodAutoscaler per node label, for clusters WITHOUT
# KEDA. Not in kustomization.yaml: 70-autoscale.yaml's KEDA ScaledObjects scale
# the same Deployments, and two autoscalers on one Deployment fight over its
# replica count. Use one or the other:
#
#   kubectl delete -f deploy/k8s-scale/70-autoscale.yaml     # if it was applied
#   kubectl apply -f deploy/k8s-scale/optional/node-cpu-fallback-hpa.yaml
#
# (or, with kustomize, replace 70-autoscale.yaml by this file in your own
# kustomization). The local overlay uses this file, since minikube has no KEDA.
#
# CPU is a POOR proxy for slaude's load: turns are dominated by waiting on
# the LLM provider, so a node can be saturated (all concurrency slots busy)
# at low CPU. Use this only until KEDA is installed; expect it to under-scale.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: slaude-node-cpu-fallback
  namespace: slaude-scale
  annotations:
    slaude/disabled: "delete the ScaledObject before applying this fallback"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: slaude-node
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      # Slow scale-down: warm sessions on a reaped replica cold-resume
      # elsewhere, but churning replicas every window wastes that warmth.
      stabilizationWindowSeconds: 600
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: slaude-node-finance-cpu-fallback
  namespace: slaude-scale
  annotations:
    slaude/disabled: "delete the ScaledObject before applying this fallback"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: slaude-node-finance
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
