# Live-model only (--real): the agent must not narrate its own machinery.
# No KB seeding mechanism exists in scenarios-real, so the first send has the
# model write a page, then answer a question about it.
layer: trusted
as: member
steps:
  - send: { text: "Call the kb_memoize tool with pages set to a single-element array containing { slug: \"notes/voice-natural\", content: \"Deploys ship every Thursday.\", summary: \"voice scenario seed\" }. Then, in your own words, tell me which day deploys ship." }
  - expect_card: { kind: approval }
  - click: { as: U0APP, action: approve }
  - expect_reply: { contains: "Thursday" }
  - expect_natural_voice: {}
  - send: { text: "List the files in your workspace." }
  - expect_natural_voice: {}
